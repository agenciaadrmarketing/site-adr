<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Popup ADR — página de teste</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090a; color: #f2f2f3; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 560px; padding: 32px 20px; text-align: center; display: grid; gap: 18px; justify-items: center; }
    h1 { margin: 0; font-size: 26px; font-weight: 600; }
    p { margin: 0; color: #b7b7ba; line-height: 1.6; }
    button { font: inherit; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px; padding: 16px 28px; border-radius: 999px; border: 1px solid #f2f2f3; background: #f2f2f3; color: #09090a; cursor: pointer; }
    code { background: rgba(242, 242, 243, 0.08); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Página de teste do popup</h1>
    <p>Esta página usa o <code>data-modo="teste"</code>: o formulário funciona por completo, mas <strong>nada é enviado à planilha</strong>. O WhatsApp abre normalmente.</p>
    <button type="button" data-adr-popup="demo">Pedir análise gratuita</button>
    <p>No computador, mover o mouse para fora da janela pela parte de cima também abre o popup (uma vez por sessão).</p>
  </main>
  <script src="adr-popup.js" data-modo="teste" defer></script>
</body>
</html>
